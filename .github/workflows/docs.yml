# Build the documentation in English and German and publish it on GitHub Pages.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is then at https://<user>.github.io/<repository>/ (it forwards to the language of the browser).
#
# Every push and pull request builds both languages with -W: a warning, or a German text that is missing,
# fails the build. Only pushes to main publish the result.

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and the documentation tools
        run: pip install -e ".[docs]"

      - name: Build English and German
        run: python docs/_scripts/build_docs.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
