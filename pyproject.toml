[build-system]
requires = ["hatchling>=1.27"]  # 1.27 understands the SPDX license expression below
build-backend = "hatchling.build"

[project]
name = "cdec"
dynamic = ["version"]
description = "Download Earth observation rasters (NDVI, EVI, true colour, DEM, land cover, ...) from the Copernicus Data Space openEO backend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["earth observation", "remote sensing", "sentinel-2", "copernicus", "openeo", "ndvi", "teaching"]
authors = [
  { name = "Soeren Sparmann", email = "sparmann@mail.uni-paderborn.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "openeo>=0.37",  # 0.37 added Shapely geometries / GeoJSON files as spatial_extent
  "numpy",
  "rasterio",
  "matplotlib>=3.5",  # plotting; 3.5 added layout="constrained"
  "rio-cogeo",
  "shapely",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]
docs = [
  "sphinx>=7",
  "furo",
]

[project.urls]
Documentation = "https://github.com/soespa/cdec-python#readme"
Issues = "https://github.com/soespa/cdec-python/issues"
Source = "https://github.com/soespa/cdec-python"

[tool.hatch.version]
path = "src/cdec/__about__.py"

[tool.hatch.envs.default]
features = ["test", "docs"]  # with Sphinx installed, `hatch run test` also runs the tests of the documentation
dependencies = [
  "coverage[toml]>=6.5",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-live = "pytest --live {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[tool.hatch.envs.docs]
features = ["docs"]
[tool.hatch.envs.docs.scripts]
build = "python docs/_scripts/build_docs.py"

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[tool.hatch.envs.types]
features = ["test", "docs"]  # the tests import pytest and babel (a dependency of Sphinx)
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/cdec tests}"

[tool.mypy]
ignore_missing_imports = true  # rasterio and rio-cogeo ship no type information

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # lets pytest import `cdec` even before `pip install -e .`
markers = [
  "live: really downloads data from the Copernicus Data Space (needs a login, run with --live)",
]

[tool.coverage.run]
source_pkgs = ["cdec", "tests"]
branch = true
parallel = true
omit = [
  "src/cdec/__about__.py",
]

[tool.coverage.paths]
cdec = ["src/cdec", "*/cdec/src/cdec"]
tests = ["tests", "*/cdec/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
